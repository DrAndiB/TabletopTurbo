<!doctype html><html><body style="margin:0;background:#222">
<div id="out" style="display:flex;flex-wrap:wrap;gap:4px"></div>
<script type="module">
import * as TX from '../js/textures.js';
const q = new URLSearchParams(location.search);
const fn = q.get('fn'); const args = JSON.parse(q.get('args')||'{}');
const res = TX[fn](args);
for (const [k,t] of Object.entries(res)) {
  const c = t.image; c.style.width = (q.get('w')||512)+'px'; c.title=k;
  document.getElementById('out').appendChild(c);
}
window.done = true;
</script></body></html>
